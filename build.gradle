plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects { p ->
    if (p.parent == rootProject) return

    def loader = p.name
    def versionDir = p.parent.projectDir

    apply plugin: 'java'
    apply plugin: loader == 'fabric' ? 'net.fabricmc.fabric-loom' : 'net.neoforged.moddev'

    version = "${rootProject.mod_version}+${p.minecraft_version}"
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${loader}"
    }

    repositories {
        mavenCentral()
    }

    sourceSets {
        main {
            java.srcDirs = [
                    rootProject.file('src/main/java'),
                    new File(versionDir, 'src/main/java'),
                    rootProject.file("${loader}/src/main/java")
            ]
            resources.srcDirs = [rootProject.file('src/main/resources'), rootProject.file("${loader}/src/main/resources")]
        }
    }

    def props = [
            version                 : p.version,
            minecraft_dependency    : p.minecraft_dependency,
            neoforge_min            : p.neoforge_min,
            neoforge_minecraft_range: p.neoforge_minecraft_range
    ]
    processResources {
        inputs.properties props
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand props
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.encoding = "UTF-8"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    if (loader == 'fabric') {
        sourceSets {
            test {
                java.srcDirs = [rootProject.file('src/test/java')]
                resources.srcDirs = [rootProject.file('src/test/resources')]
            }
        }

        dependencies {
            minecraft "com.mojang:minecraft:${p.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${p.fabric_version}"

            testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
            testImplementation platform("org.junit:junit-bom:5.11.4")
            testImplementation "org.junit.jupiter:junit-jupiter"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        }

        test {
            useJUnitPlatform()
            maxHeapSize = "3G"
            testLogging {
                events "passed", "failed", "skipped"
                exceptionFormat "full"
            }
        }
    } else {
        neoForge {
            version = p.neoforge_version
            runs {
                client {
                    client()
                }
            }
            mods {
                seedscout {
                    sourceSet(sourceSets.main)
                }
            }
        }
    }
}

tasks.register('collectJars', Copy) {
    def loaderProjects = subprojects.findAll { it.parent != rootProject }
    dependsOn loaderProjects.collect { "${it.path}:assemble" }
    from(loaderProjects.collect { it.layout.buildDirectory.dir('libs') }) {
        exclude '*-sources.jar'
    }
    into layout.buildDirectory.dir('libs')
}
